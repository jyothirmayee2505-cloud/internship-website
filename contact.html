<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Somula Jyothirmayee</title>
  <meta name="description" content="Send a message to Somula Jyothirmayee.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="container nav-bar" aria-label="Main">
    <a class="brand" href="index.html">Jyothirmayee</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>
</header>
<main id="main">
  <section class="section">
    <div class="container">
      <h1>Contact</h1>
      <p>Write a message and I will get back to you. All fields are required.</p>
      <form id="contact-form" novalidate>
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"><p class="error" id="name-error"></p></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="error" id="email-error"></p></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message"></textarea><p class="error" id="message-error"></p></div>
        <button class="btn" type="submit">Send message</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Somula Jyothirmayee. Built with HTML5, CSS3 and JavaScript during the CODTECH web development internship.</p>
    <p><a href="contact.html">Get in touch</a></p>
  </div>
</footer>
<script src="js/main.js"></script>
</body>
</html>
